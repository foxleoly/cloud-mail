name: 🔍 Diagnose Cloudflare KV
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run diagnostics
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NAME: ${{ vars.NAME }}
        run: |
          set +e
          echo "=== A. Workers Builds config (is git-connected autopilot on?) ==="
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$NAME/build-config" \
            | jq -c '{success, errors, result}' | head -c 1200
          echo ""
          echo "=== B. Recent builds ==="
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$NAME/builds" \
            | jq -c '{success, errors, builds: [.result[]? | {id: (.id // "?")[0:8], status, created: .created_at}][0:6]}'
          echo "=== C. Current script settings bindings after redeploy ==="
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$NAME/settings" \
            | jq -c '{success, bindings: [.result.bindings[]? | .name] | sort}'
