name: 🔍 Diagnose Cloudflare KV
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run diagnostics
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NAME: ${{ vars.NAME }}
        run: |
          set +e
          BASE="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$NAME"
          AUTH="Authorization: Bearer $CF_TOKEN"
          echo "=== A. All deployments (last 6) ==="
          curl -s -H "$AUTH" "$BASE/deployments" \
            | jq -c '.result.deployments[0:6][] | {created: .created_on, source: .source, strategy, version: .versions[0].version_id[0:8]}'
          echo "=== B. Version details: bindings + metadata each ==="
          for VID in $(curl -s -H "$AUTH" "$BASE/deployments" | jq -r '.result.deployments[0:6][].versions[0].version_id'); do
            echo "--- ${VID:0:8} ---"
            curl -s -H "$AUTH" "$BASE/versions/$VID" \
              | jq -c '{created: .result.created_on, source: .result.metadata.source, author: .result.metadata.author, bindings: [(.result.resources.binding_list // .result.resources.bindings // [])[]? | {n: .name, t: .type}] | sort_by(.n)}' | head -c 1600
            echo ""
          done
          echo "=== C. Script-level settings source of truth ==="
          curl -s -H "$AUTH" "$BASE/settings" | jq -c '{success, bindings: [.result.bindings[]? | {n: .name, t: .type}] | sort_by(.n)}' | head -c 1600
