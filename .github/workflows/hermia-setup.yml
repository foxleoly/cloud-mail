name: 🔧 Hermia account setup
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Create account and restore settings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NAME: ${{ vars.NAME }}
          KV_ID: ${{ vars.KV_NAMESPACE_ID }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          HERMIA_PW: ${{ secrets.HERMIA_PW }}
        run: |
          set -e
          BASE="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces/$KV_ID/values/setting%3A"
          AUTH="Authorization: Bearer $CF_TOKEN"
          echo "=== 1. Backup current setting (verbatim) ==="
          curl -s -H "$AUTH" "$BASE" -o setting-backup.json
          cp setting-backup.json setting-orig.json
          jq -c '.' setting-orig.json | head -c 1200
          echo ""
          echo "=== 2. Temporarily enable registration (register=0, regKey=1(close), registerVerify=1(close), loginVerify=1(close)) ==="
          jq -c '.register=0 | .regKey=1 | .registerVerify=1 | .loginVerify=1' setting-orig.json > setting-open.json
          jq -c '{register, regKey, registerVerify, loginVerify}' setting-open.json
          curl -s -X PUT -H "$AUTH" --data-binary @setting-open.json "$BASE" | jq -c '{success, errors}'
          sleep 3
          echo "=== 3. Register hermia ==="
          curl -s --max-time 30 -X POST "https://$CUSTOM_DOMAIN/api/register" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"hermia@foxleoly.link\",\"password\":\"$HERMIA_PW\"}" -o reg.json -w "HTTP %{http_code}\n"
          head -c 300 reg.json; echo ""
          echo "=== 4. Login test ==="
          curl -s --max-time 30 -X POST "https://$CUSTOM_DOMAIN/api/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"hermia@foxleoly.link\",\"password\":\"$HERMIA_PW\"}" -o login.json -w "HTTP %{http_code}\n"
          jq -c '{code, has_jwt: ((.data // .jwt // "") | type == "string" and length > 20)}' login.json 2>/dev/null || head -c 200 login.json
          echo ""
          echo "=== 5. Restore original setting ==="
          curl -s -X PUT -H "$AUTH" --data-binary @setting-orig.json "$BASE" | jq -c '{success, errors}'
          sleep 2
          echo "=== 6. Verify restore ==="
          curl -s -H "$AUTH" "$BASE" | jq -c '{register, regKey, registerVerify, loginVerify}'
          echo "=== DONE ==="
